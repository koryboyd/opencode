@import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Courier+Prime:wght@400;700&display=swap');

/* ── NBT GLOW PULSE ── */
@keyframes nbtGlow{0%,100%{text-shadow:0 0 8px var(--green),0 0 16px var(--green),0 0 32px var(--green2)}50%{text-shadow:0 0 4px var(--green),0 0 8px var(--green)}}
@keyframes marchBorder{0%{background-position:0 0,100% 0,100% 100%,0 100%}100%{background-position:20px 0,100% 20px,calc(100% - 20px) 100%,0 calc(100% - 20px)}}
@keyframes nbtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes chomikSpin{0%,100%{transform:rotate(0deg) scale(1)}25%{transform:rotate(-5deg) scale(1.1)}75%{transform:rotate(5deg) scale(1.1)}}

:root {
  --bg:#080808;--bg1:#0c0c0c;--bg2:#101010;--bg3:#141414;--b1:#1a1a1a;--b2:#222;
  --txt:#cccccc;--dim:#1e1e1e;--dim2:#444;
  --green:#00ff41;--cyan:#00ff41;--purp:#00cc33;--red:#ff3355;--oran:#ff6b35;
  --yell:#00ff41;--pink:#00dd33;--teal:#00ff41;--ice:#88ffaa;--lobster:#ff6b35;
  --green2:#00cc33;--green3:rgba(0,255,65,.12);
}
.light-theme {
  --bg:#f5fff5;--bg1:#edfff0;--bg2:#e0ffe8;--bg3:#d0ffd8;--b1:#b0ddb8;--b2:#90ccaa;
  --txt:#003311;--dim:#80cc90;--dim2:#50aa70;
  --green:#006622;--cyan:#008833;--purp:#004400;--red:#cc1133;--oran:#cc4400;
  --yell:#226600;--pink:#004422;--teal:#009944;--ice:#003322;--lobster:#cc4411;
  --green2:#008833;--green3:rgba(0,100,30,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Courier Prime','Courier New',monospace;font-size:12px;line-height:1.5;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,255,65,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.018) 1px,transparent 1px);
  background-size:44px 44px;animation:bgScroll 30s linear infinite}
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,.012) 2px,rgba(0,255,65,.012) 4px)}
.light-theme::before{background-image:linear-gradient(rgba(0,100,30,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,100,30,.025) 1px,transparent 1px)}
.light-theme::after{background:none}
@keyframes bgScroll{0%{background-position:0 0}100%{background-position:44px 44px}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes runFlash{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(0,255,65,.2)}50%{box-shadow:0 0 25px rgba(0,255,65,.5)}}
@keyframes lobsterGlow{0%,100%{box-shadow:0 0 10px rgba(255,107,53,.2)}50%{box-shadow:0 0 25px rgba(255,107,53,.5)}}
@keyframes crtFlicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.8}94%{opacity:1}97%{opacity:.9}98%{opacity:1}}
@keyframes termBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes exfoliate{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.3) rotate(-5deg)}50%{transform:scale(1.5) rotate(5deg)}75%{transform:scale(1.3) rotate(-3deg)}100%{transform:scale(1) rotate(0deg)}}
#APP{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;animation:crtFlicker 8s infinite}

/* ── TOPBAR ── */
#TOPBAR{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:5px 12px;background:#0a0a0a;border-bottom:2px solid var(--green3);flex-wrap:nowrap;overflow:hidden;position:relative;box-shadow:0 2px 20px rgba(0,255,65,.06)}
.logo-mark{display:flex;align-items:center;gap:5px;flex-shrink:0;cursor:pointer;padding:2px 4px}
.logo-mark:hover img{filter:brightness(1.2) drop-shadow(0 0 4px rgba(0,255,65,.5))}
.logo-words{line-height:1.25;flex-shrink:0}
.logo-main{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.12em;font-family:'Press Start 2P',monospace;animation:nbtGlow 2.5s ease-in-out infinite;text-shadow:0 0 10px var(--green)}
.logo-sub{color:var(--dim2);font-size:6px;letter-spacing:.08em}
.status-cluster{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ollama-pill,.oc-pill{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:2px;border:1px solid rgba(0,255,65,.2);background:#0a0a0a;font-size:7.5px;flex-shrink:0;cursor:pointer;transition:all .2s;font-family:'VT323',monospace;font-size:13px;letter-spacing:.05em}
.ollama-pill:hover{border-color:var(--green);box-shadow:0 0 8px rgba(0,255,65,.2)}
.oc-pill{border-color:rgba(0,255,65,.15)}
.oc-pill:hover{border-color:var(--green);box-shadow:0 0 8px rgba(0,255,65,.2)}
.pill-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:all .3s;flex-shrink:0}
.pill-dot.on{background:var(--green);box-shadow:0 0 8px var(--green),0 0 16px rgba(0,255,65,.3);animation:pulse 2s infinite}
.pill-dot.err{background:var(--red);box-shadow:0 0 6px var(--red)}
.pill-dot.oc{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite}
#modelSel{background:var(--bg2);border:1px solid var(--b2);border-radius:3px;color:var(--cyan);font-family:inherit;font-size:9px;padding:3px 6px;outline:none;cursor:pointer;max-width:160px}
.tok-ctl{display:none}
/* token slider removed */
.total-badge{display:none}
.ap-btn.oc-push{background:linear-gradient(135deg,#8a3300,#ff6b35);color:#fff;border-color:#ff6b35}

.topbar-actions{display:flex;gap:4px;flex-shrink:0;margin-left:auto}
.tb-icon-btn{background:transparent;border:1px solid var(--b2);border-radius:3px;padding:3px 7px;color:var(--dim2);font-family:inherit;font-size:10px;cursor:pointer;transition:all .15s}
.tb-icon-btn:hover{color:var(--txt);border-color:var(--dim2)}
.tb-icon-btn.active{color:var(--cyan);border-color:rgba(0,212,255,.3)}
.mode-rail{display:flex;gap:0;border:1px solid var(--b2);border-radius:4px;overflow:hidden;flex-shrink:0}
.mode-tab{padding:5px 11px;background:transparent;border:none;border-right:1px solid var(--b2);color:var(--dim2);font-family:inherit;font-size:8.5px;letter-spacing:.06em;cursor:pointer;transition:all .18s;white-space:nowrap}
.mode-tab:last-child{border-right:none}
.mode-tab.on{color:var(--green);background:rgba(0,255,65,.07);font-weight:700}
.mode-tab.on-oc{color:var(--lobster);background:rgba(255,107,53,.07);font-weight:700}
.mode-tab:hover:not(.on):not(.on-oc){color:var(--txt)}

/* ── MAIN ── */
#MAIN{flex:1;overflow:hidden;display:flex}

/* ── SIDEBAR ── */
#SB{width:200px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;transition:width .2s}

.sb-btn{width:100%;display:flex;align-items:center;gap:4px;padding:3px 6px;margin-bottom:2px;background:transparent;border:1px solid var(--b1);border-radius:3px;color:var(--dim2);font-family:inherit;font-size:7.5px;text-align:left;cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden}
.sb-btn:hover{color:var(--txt);border-color:var(--b2);background:rgba(255,255,255,.02)}
.sb-btn.done{color:var(--cyan);border-color:rgba(0,212,255,.2);background:rgba(0,212,255,.04)}
.sb-btn.run{color:var(--yell);border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.06);animation:runFlash .9s infinite}
.sb-btn.fav{border-color:rgba(255,215,0,.25)}
.sb-btn:disabled{opacity:.2;cursor:not-allowed}
.sb-tag{font-size:6px;margin-left:auto;flex-shrink:0;opacity:.7}
.sb-text{flex:1;overflow:hidden;text-overflow:ellipsis}
.act-btn{width:100%;border:none;border-radius:3px;padding:5px 6px;margin-bottom:3px;font-family:inherit;font-size:8px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.04em}
.act-btn:disabled{opacity:.25;cursor:not-allowed}
.act-btn:hover:not(:disabled){filter:brightness(1.1)}
.b-g{background:linear-gradient(135deg,#007744,#44ffaa);color:#000}
.b-p{background:linear-gradient(135deg,#3a0a8a,#aa44ff);color:#fff}
.b-r{background:linear-gradient(135deg,#8a0022,#ff3355);color:#fff}
.b-c{background:linear-gradient(135deg,#004455,#00ff41);color:#fff}
.b-o{background:linear-gradient(135deg,#884400,#ff8833);color:#fff}
.b-y{background:linear-gradient(135deg,#885500,#ffd700);color:#000}
.b-lob{background:linear-gradient(135deg,#8a3300,#ff6b35);color:#fff}
.b-mission{background:linear-gradient(135deg,#1a0044,var(--purp),var(--green));color:#fff;font-size:9.5px;padding:8px 6px;letter-spacing:.06em}

/* ── CONTENT ── */
#CONTENT{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tab-bar{flex-shrink:0;display:flex;background:var(--bg1);border-bottom:1px solid var(--b1);overflow-x:auto}
.t-btn{padding:5px 11px;flex-shrink:0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim2);font-family:inherit;font-size:8.5px;cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:3px}
.t-btn.on{color:var(--cyan);border-bottom-color:var(--cyan);background:rgba(0,212,255,.03)}
.t-btn:hover:not(.on){color:var(--txt)}
.t-count{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);color:var(--cyan);border-radius:8px;padding:0 4px;font-size:6.5px}

/* ── PANELS ── */
.panel{flex:1;overflow-y:auto;padding:10px;display:none;background:var(--bg)}
.panel.on{display:block}
.pf{flex:1;overflow:hidden;display:none;flex-direction:column}
.pf.on{display:flex}
.ps{flex:1;overflow:hidden;display:none}
.ps.on{display:flex}
.mt-mt{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:200px;gap:9px;opacity:.15}
.mt-mt .ico{font-size:28px}
.mt-mt .msg{color:#405070;font-size:8.5px;text-align:center;line-height:2.1}

/* ── AI OUTPUT ── */
.ai-out{font-size:10px;line-height:1.92;color:#8aaccc}
.ai-out pre{background:#050510;border:1px solid rgba(0,212,255,.1);border-left:3px solid var(--cyan);padding:9px;border-radius:4px;overflow-x:auto;font-size:9px;color:#9adeff;margin:6px 0;white-space:pre-wrap}

.sev-c{background:rgba(255,51,85,.15);color:#ff6688;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:700}

.sev-m{background:rgba(255,215,0,.15);color:#ffdd55;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:700}
.sev-l{background:rgba(0,180,255,.15);color:#55ccff;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:700}
.cur{display:inline-block;width:7px;height:12px;background:var(--cyan);margin-left:2px;animation:blink .7s infinite;vertical-align:bottom}

/* ── INPUTS ── */
.ti{flex:1;background:var(--bg2);border:1px solid rgba(0,212,255,.1);border-radius:4px;color:var(--txt);font-family:inherit;font-size:10px;padding:6px 8px;resize:none;outline:none}
.ti:focus{border-color:rgba(0,212,255,.22)}
.ca{width:100%;background:var(--bg2);border:1px solid rgba(0,212,255,.1);border-radius:4px;color:#88b8d8;font-family:inherit;font-size:10px;padding:7px;resize:none;outline:none;transition:border-color .2s}
.ca:focus{border-color:rgba(0,212,255,.3)}
.send-btn{background:linear-gradient(135deg,var(--cyan),#004466);border:none;border-radius:4px;padding:6px 13px;color:#fff;font-family:inherit;font-size:9px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s}

<script>
// ═══════════════════════════════════════════════════════════
//  OpenNBT — AUTONOMOUS EDITION V2
//  MODIFIED FOR PROXY ACCESS
// ═══════════════════════════════════════════════════════════

// Override API endpoints to use proxy
const PROXY = {
  ollama: '/api/ollama',
  opencode: '/api/opencode'
};

// ── CONFIG ─────────────────────────────────────────────────
var $ = function(id) { return document.getElementById(id); };
var esc = function(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
var scrollBot = function(el) { if (el && G.settings.autoScroll) requestAnimationFrame(function(){ el.scrollTop = el.scrollHeight; }); };
var ts = function() { return new Date().toLocaleTimeString('en',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
function toast(msg, dur) { if (dur === undefined) dur = 2200; var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, dur); }
function dlText(c, f) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type: 'text/plain'})); a.download = f; document.body.appendChild(a); a.click(); a.remove(); }
function dlJSON(o, f) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], {type: 'application/json'})); a.download = f; document.body.appendChild(a); a.click(); a.remove(); }
function cp(text, btn) { try { navigator.clipboard.writeText(text); } catch(e) { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } if(btn) { var o = btn.textContent; btn.textContent = '✓'; btn.classList.add('ok'); setTimeout(function(){ btn.textContent = o; btn.classList.remove('ok'); }, 1400); } }
function triggerExfoliate(el) { el.style.animation = 'none'; requestAnimationFrame(function(){ el.style.animation = 'exfoliate .5s ease'; }); toast('NoBanThanks! 🦞'); }

var G = {
  model:'', maxTok:4096, totalTok:0,
  mode:'lab', reTab:'anal', ocTab:'agent',
  ollamaOk:false, ocOk:false, thinkingForLab:false,
  settings:{ temperature:0.7, topP:0.95, autoScroll:true,
    ollamaUrl:PROXY.ollama,  // Use proxy
    ocUrl:PROXY.opencode,    // Use proxy
    ocApiKey:'' },
  theme:'dark', labStartTime:null, favorites:new Set()
};

// ── OLLAMA API ──────────────────────────────────────────────
async function chat(sys, prompt, onChunk, maxTok) {
  if (!G.model) throw new Error('No model selected — is Ollama running?');
  if (G.labAbort||G.reAbort||G.mAbort) throw new Error('Aborted');
  audit(`chat → ${G.model} [${sys.slice(0,40)}…]`,'info',{model:G.model,maxTok:maxTok||G.maxTok});
  const messages=[{role:'system',content:sys},{role:'user',content:prompt}];
  // USE PROXY ENDPOINT
  const res=await fetch(`${PROXY.ollama}/api/chat`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:G.model,stream:true,
      options:{num_predict:maxTok||G.maxTok,temperature:G.settings.temperature,top_p:G.settings.topP},
      messages}),
  });
  // ... rest of function remains same
}

async function ollamaCheck(forceToast=false){
  const refreshBtn=$('btnOllamaRefresh');
  if(refreshBtn){refreshBtn.textContent='⟳';refreshBtn.style.color='var(--cyan)';}
  try{
    // USE PROXY ENDPOINT
    const r=await fetch(`${PROXY.ollama}/api/tags`);
    if(!r.ok) throw new Error('not ok');
    const d=await r.json();
    G.ollamaOk=true;
    $('sDot').className='pill-dot on';
    $('sTxt').textContent='ollama online';$('sTxt').style.color='var(--green)';
    const sel=$('modelSel');sel.innerHTML='';
    const ms=d.models||[];
    if(!ms.length){sel.innerHTML='<option value="">no models — ollama pull qwen2.5-coder:14b</option>';audit('No models found','warn');if(refreshBtn){refreshBtn.textContent='↺';refreshBtn.style.color='var(--dim2)';}return;}
    ms.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;sel.appendChild(o);});
    G.model=sel.value;
    sel.onchange=()=>{G.model=sel.value;audit(`Model: ${G.model}`,'info');};
    audit(`Ollama models: ${ms.map(m=>m.name).join(', ')}`,'ok',{count:ms.length});
    if(forceToast)toast(`Ollama online — ${ms.length} model${ms.length===1?'':'s'}`);
  }catch(e){
    G.ollamaOk=false;
    $('sDot').className='pill-dot err';$('sTxt').textContent='offline';$('sTxt').style.color='var(--red)';
    $('modelSel').innerHTML='<option value="">start ollama first</option>';
    audit(`Ollama unreachable: ${e.message}`,'warn');
    if(forceToast)toast('Ollama unreachable — is it running?');
    else setTimeout(ollamaCheck,5000);
  }
  if(refreshBtn){refreshBtn.textContent='↺';refreshBtn.style.color='var(--dim2)';}
}

// ── OPENCODE SERVER API ────────────────────────────────────
async function checkOCServer(){
  try{
    // USE PROXY ENDPOINT
    const r=await fetch(`${PROXY.opencode}/api/health`,{signal:AbortSignal.timeout(3000)});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    G.ocOk=true;
    $('ocDot').className='pill-dot oc';$('ocTxt').textContent='oc:ready';$('ocTxt').style.color='var(--lobster)';
    $('ocServerStatus').textContent='🦞 OpenCode online';$('ocServerStatus').style.color='var(--lobster)';
    audit('OpenCode server connected','ok');
    updateSelfModUI();
    return true;
  }catch(e){
    G.ocOk=false;
    $('ocDot').className='pill-dot err';$('ocTxt').textContent='oc:offline';$('ocTxt').style.color='var(--red)';
    $('ocServerStatus').textContent='⚠ OpenCode offline';$('ocServerStatus').style.color='var(--dim2)';
    audit(`OpenCode server unreachable: ${e.message}. Start with: opencode --port 3000`,'warn');
    updateSelfModUI();
    return false;
  }
}

// Modify ocExec, ocReadFile, ocWriteFile, ocListDir, ocGitStatus to use PROXY.opencode

async function ocExec(cmd,cwd){
  audit(`exec: ${cmd}`,'exec',{cmd,cwd:cwd||G.termCwd});
  const res=await fetch(`${PROXY.opencode}/api/exec`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({command:cmd,cwd:cwd||G.termCwd||'.'})
  });
  if(!res.ok){
    const t=await res.text();
    throw new Error(`exec HTTP ${res.status}: ${t.slice(0,200)}`);
  }
  const d=await res.json();
  return d;
}

// ── OPENCODE STREAMING AI WITH REAL TOOLS ─────────────────
async function ocAgentRun(task, context, onEvent){
  const headers={'Content-Type':'application/json'};
  if(G.settings.ocApiKey) headers['Authorization']=`Bearer ${G.settings.ocApiKey}`;
  // USE PROXY ENDPOINT - note the /v1/chat/completions path
  const res=await fetch(`${PROXY.opencode}/v1/chat/completions`,{
    method:'POST',headers,
    body:JSON.stringify({
      model:'auto',stream:true,
      messages:[
        {role:'system',content:`You are OpenNBT, a powerful autonomous coding agent. Use your tools to complete the task. Be systematic, thorough, and always verify your work. After file writes, read them back to confirm. After code changes, run tests if possible. Commit with descriptive messages.`},
        ...(context?[{role:'system',content:context}]:[]),
        {role:'user',content:task}
      ],
      tools:[
        {type:'function',function:{name:'bash_exec',description:'Execute bash command',parameters:{type:'object',properties:{command:{type:'string'},cwd:{type:'string'}},required:['command']}}},
        {type:'function',function:{name:'file_read',description:'Read file contents',parameters:{type:'object',properties:{path:{type:'string'}},required:['path']}}},
        {type:'function',function:{name:'file_write',description:'Write file contents',parameters:{type:'object',properties:{path:{type:'string'},content:{type:'string'}},required:['path','content']}}},
        {type:'function',function:{name:'file_list',description:'List directory contents',parameters:{type:'object',properties:{path:{type:'string'}},required:['path']}}},
        {type:'function',function:{name:'git_status',description:'Get git status',parameters:{type:'object',properties:{}}}},
        {type:'function',function:{name:'git_commit',description:'Git add all and commit',parameters:{type:'object',properties:{message:{type:'string'}},required:['message']}}},
      ]
    })
  });
  if(!res.ok) throw new Error(`OpenCode HTTP ${res.status}: ${(await res.text()).slice(0,200)}`);
  const reader=res.body.getReader(),dec=new TextDecoder();
  let buf='',full='';
  while(true){
    const{done,value}=await reader.read();
    if(done) break;
    if(G.agentAbort){reader.cancel();throw new Error('Aborted');}
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');
    buf=lines.pop()||'';
    for(const line of lines){
      if(!line.startsWith('data: ')) continue;
      const data=line.slice(6).trim();
      if(data==='[DONE]') return full;
      try{
        const j=JSON.parse(data);
        const delta=j.choices?.[0]?.delta;
        if(delta?.content){full+=delta.content;if(onEvent)onEvent({type:'text',content:delta.content,full});}
        if(delta?.tool_calls){if(onEvent)onEvent({type:'tool_calls',tool_calls:delta.tool_calls});}
        if(j.choices?.[0]?.finish_reason==='tool_calls'){if(onEvent)onEvent({type:'finish_tool_calls'});}
      }catch{}
    }
  }
  return full;
}
